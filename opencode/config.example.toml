[holder]
agents = ["opencode", "claude", "codex"]

# Uncomment only if the SDK or AVD home is not the default for your platform.
# [android]
# sdk = "/path/to/Android/Sdk"
# avd_home = "/path/to/.android/avd"

[kinds.emulator]
preset = "android-emulator"
preselect = ["*"]
unmanaged = "grant"
boot_timeout = "4m"
start_args = ["-no-window", "-no-audio", "-no-boot-anim", "-gpu", "swiftshader_indirect"]

[guard]
strict = true
